{% set name = "tilupy" %}
{% set version = "2.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tilupy-{{ version }}.tar.gz
  sha256: f26c4c6ae49a57c6d2ebf1a1f44f7dfa5e0d70f35dc2f62d2cf037610db3a9d6

build:
  entry_points:
    - tilupy_plot = tilupy.cmd:_tilupy_plot
    - tilupy_to_raster = tilupy.cmd:_tilupy_to_raster
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - seaborn
    - requests
    - scipy
    - pytopomap
    - rasterio
    - shapely

test:
  imports:
    - tilupy
  commands:
    - pip check
    - tilupy_plot --help
    - tilupy_to_raster --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/marcperuz/tilupy
  summary: Thin-layer models unified processing tool
  license: CECILL-C
  license_file: LICENSE

extra:
  recipe-maintainers:
    - marcperuz
